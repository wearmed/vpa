# vur dependency name map: Arch package name -> Void xbps package name
# Format: <arch-name>=<void-name>
# Use '-' as the void-name to mark a dependency with NO Void equivalent
# (vur will warn and let you choose to abort or continue, never guess).
# Blank lines and lines starting with # are ignored.
# User overrides: ~/.config/vur/depmap.conf (checked first, wins on conflict).

gtk2=gtk+
gtk3=gtk+3
qt5-base=qt5
imagemagick=ImageMagick
python-pip=python3-pip
ffmpeg=ffmpeg6
udev=eudev
libudev=eudev-libudev

# Void uses runit, not systemd (same situation Artix Linux deals with using
# OpenRC/runit/s6 on top of Arch's package ecosystem). Void, like Artix, does
# ship elogind as the systemd-logind replacement -- but that's a different
# library/ABI (libelogind, not libsystemd), not a drop-in rename, so it's
# never auto-substituted here. Arch's "elogind" AUR/community package already
# shares its name with Void's, so it resolves via passthrough with no entry
# needed. These have no equivalent at all and must stay unresolvable rather
# than get a guessed (and wrong) substitute:
systemd=-
systemd-libs=-
libsystemd=-
systemd-udev=-
systemd-sysvcompat=-
libnss-systemd=-
