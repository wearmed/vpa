# vur dependency name map: Arch package name -> Void xbps package name
# Format: <arch-name>=<void-name>
# Use '-' as the void-name to mark a dependency with NO Void equivalent
# (vur will warn and let you choose to abort or continue, never guess).
# Blank lines and lines starting with # are ignored.
# User overrides: ~/.config/vur/depmap.conf (checked first, wins on conflict).

gtk2=gtk+
gtk3=gtk+3
qt5-base=qt5
imagemagick=ImageMagick
python-pip=python3-pip
ffmpeg=ffmpeg6
udev=eudev

# Void uses runit, not systemd -- these have no direct equivalent.
systemd=-
systemd-libs=-
libsystemd=-
systemd-udev=-
