# Category -> package map used by "vpa search cat <category>".
#
# Neither xbps nor the AUR RPC records what kind of thing a package is, so
# this list is curated. Flathub does record it (AppStream), so a category can
# also name a freedesktop category with @Name -- when appstreamcli is
# installed, the Flatpak side of the results is pulled live from that rather
# than from the names below.
#
#   name|alias|alias @FreedesktopCategory: pkg pkg pkg
#
# Names are checked against Void's repos, the AUR and Flathub, and only the
# ones that actually exist are shown, so listing something unavailable costs
# nothing. Repeating a category name adds to it.
#
# Add your own in ~/.config/vpa/categories.conf. A category defined there
# replaces the built-in one of the same name, so copy a line before editing.

